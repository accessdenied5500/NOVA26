<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>Nova 26 - Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="app-body">
    <div class="notes-page">
        <div class="topbar notes-topbar">
            <div>
                <p class="eyebrow">Notes Hub</p>
                <h1>📝 My Notes</h1>
                <p class="subtext">Keep subject-wise notes and review them anytime.</p>
            </div>
            <a href="dashboard.html" class="secondary-btn text-link-btn">Back to dashboard</a>
        </div>

        <input type="text" id="searchNote" placeholder="Search notes...">

        <div id="subjectTabs" class="subject-tabs"></div>

        <form id="noteForm" class="note-form">
            <input id="noteTitle" type="text" placeholder="Note title" required>
            <select id="noteSubject">
                <option>Informatics Practices</option>
                <option>Economics</option>
                <option>Business Studies</option>
                <option>Accountancy</option>
                <option>English</option>
            </select>
            <textarea id="noteContent" rows="4" placeholder="Write your note here..." required></textarea>
            <button type="submit" class="primary-btn">Save note</button>
        </form>

        <div id="notesContainer" class="notes-list"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
