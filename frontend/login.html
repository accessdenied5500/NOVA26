<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>Nova 26 Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="login-container">
        <img src="assets/nova26-logo.svg" alt="Nova 26 Logo" class="brand-logo small-brand-logo">
        <h1>Nova 26</h1>
        <p>Welcome back. Let’s make today productive.</p>

        <div class="login-box">
            <input id="usernameInput" type="text" placeholder="Username">
            <input id="passwordInput" type="password" placeholder="Password">

            <button id="loginBtn">Login</button>
            <button id="showRegisterBtn" type="button" class="secondary-btn">Create account</button>
            <form id="registerForm" class="register-form" hidden>
                <h3>Create account</h3>
                <input id="registerName" type="text" placeholder="Full name" required>
                <input id="registerUsername" type="text" placeholder="Create username" required>
                <input id="registerPassword" type="password" placeholder="Create password" required>
                <button type="submit" class="secondary-btn">Create account</button>
            </form>
            <p class="helper-text">Username must be unique. If it is available, your account will be stored in the server database.</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
