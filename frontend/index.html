<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Nova 26</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="splash-container">
        <div class="nova-logo">
            <img src="assets/nova26-logo.svg" alt="Nova 26 Logo" class="brand-logo">
            <h1>NOVA <span>26</span></h1>
        </div>

        <p class="tagline">Your personal student companion for study, planning, and growth.</p>

        <div class="loading">
            <div class="circle"></div>
            <p>Launching your learning space...</p>
        </div>

        <div id="installBanner" class="install-banner" hidden>
            <p>Install Nova 26 on your phone for a faster, full-screen experience.</p>
            <button id="installBtn" type="button">Install app</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
